<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Votes · Chili Cook-Off</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600;700&display=swap">

<style>body{margin:0}[hidden]{display:none!important}
#pin{font:700 1.8rem/1 var(--body);letter-spacing:.4em;padding:12px;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:7ch;text-align:center}
#pin:focus{outline:none;border-color:var(--chili)}
a{color:var(--chili);font-weight:600}</style>
</head><body>
<div class="wrap">
  <header>
    <div class="eyebrow">Chili Cook-Off · Host only</div>
    <h1>Reset all votes</h1>
    <p>Clears every ballot and empties the standings. This can't be undone.</p>
  </header>
  <form class="ballot" id="f" novalidate>
    <label class="init" for="pin">Host PIN
      <input id="pin" inputmode="numeric" maxlength="8" autocomplete="off">
    </label>
    <div id="msg" class="msg" hidden></div>
    <button type="submit" class="btn" id="go">Reset votes</button>
  </form>
  <a href="/">Back to the ballot</a>
</div>
<script>
const f=document.getElementById("f"),msg=document.getElementById("msg"),go=document.getElementById("go");
let armed=false;
f.addEventListener("submit",async e=>{
  e.preventDefault();
  const pin=document.getElementById("pin").value.trim();
  if(!pin){msg.textContent="Enter the host PIN.";msg.hidden=false;return;}
  if(!armed){armed=true;go.textContent="Tap again to erase all ballots";msg.hidden=true;return;}
  go.disabled=true;
  try{
    const r=await fetch("/api/reset",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({pin})});
    const j=await r.json().catch(()=>({}));
    msg.textContent=r.ok?`Done. Cleared ${j.cleared} ballot${j.cleared===1?"":"s"}.`:(j.error||"Reset failed. Try again.");
  }catch{msg.textContent="No connection. Try again.";}
  msg.hidden=false;armed=false;go.disabled=false;go.textContent="Reset votes";
});
</script>
</body></html>
