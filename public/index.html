<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}</style>
<title>Chili Cook-Off Ballot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow fairground score card — ballot on top, live standings below */
:root{
  --bg:#f3f1ec; --card:#ffffff; --ink:#24180f; --muted:#6d5f52; --line:#e2dbd1;
  --chili:#b3261e; --chili-ink:#ffffff; --bean:#5a3a22; --veg:#2f6b3a; --soft:#f8e6e3;
  --display:"Alfa Slab One", Georgia, serif;
  --body:"Work Sans", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17120e; --card:#221a14; --ink:#f2e9df; --muted:#b4a594; --line:#3a2e24;
  --chili:#e25a4c; --chili-ink:#1a0f0b; --bean:#d9a97c; --veg:#7cc58a; --soft:#3a1d18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120e; --card:#221a14; --ink:#f2e9df; --muted:#b4a594; --line:#3a2e24;
  --chili:#e25a4c; --chili-ink:#1a0f0b; --bean:#d9a97c; --veg:#7cc58a; --soft:#3a1d18; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:24px}
header h1{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1.05;margin:0;color:var(--chili);text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
section{display:grid;gap:12px}
h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.ballot{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:16px;display:grid;gap:16px}
label.init{display:grid;gap:6px;font-weight:600}
#initials{font:700 1.6rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:8.5ch}
#initials:focus{outline:none;border-color:var(--chili)}
.entry{display:grid;gap:8px;padding-top:14px;border-top:1px dashed var(--line)}
.entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:700;font-size:1.1rem}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1.5px solid currentColor}
.tag.veg{color:var(--veg)} .tag.meat{color:var(--bean)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale button{font:600 .95rem var(--body);font-variant-numeric:tabular-nums;padding:10px 0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:5px;cursor:pointer;min-width:0}
.scale button[aria-pressed="true"]{background:var(--chili);border-color:var(--chili);color:var(--chili-ink)}
.scale button:focus-visible,.btn:focus-visible{outline:3px solid var(--chili);outline-offset:2px}
.ends{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.btn{font:700 1rem var(--body);padding:14px;border-radius:6px;border:none;background:var(--chili);color:var(--chili-ink);cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.msg{font-size:.92rem;padding:10px 12px;border-radius:6px;background:var(--soft)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1}
.board{display:grid;gap:8px}
.rank{display:grid;grid-template-columns:2ch 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
.rank.lead{border:2px solid var(--chili)}
.pos{font-family:var(--display);font-size:1.3rem;color:var(--chili)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--chili)}
.score{text-align:right;font-variant-numeric:tabular-nums}
.score b{font-size:1.4rem}
.score small{display:block;color:var(--muted);font-size:.75rem}
.voters{font-size:.85rem;color:var(--muted)}
.voters span{display:inline-block;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:2px 2px 0 0;letter-spacing:.06em}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
</style>
</head><body>

<div class="wrap">
  <header>
    <div class="eyebrow">Chili Cook-Off · Judging</div>
    <h1>Pick the best pot</h1>
    <p>Score every chili from 1 to 10, sign with your initials, submit. One ballot per person.</p>
  </header>

  <section id="voteSec">
    <form class="ballot" id="ballot" novalidate>
      <label class="init" for="initials">Your initials
        <input id="initials" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABC">
      </label>
      <div id="entries"></div>
      <div id="formMsg" class="msg" hidden></div>
      <div class="row-btns" id="confirmRow" hidden>
        <button type="button" class="btn ghost" id="cancelOverwrite">Cancel</button>
        <button type="button" class="btn" id="confirmOverwrite">Replace ballot</button>
      </div>
      <button type="submit" class="btn" id="submit" disabled>Submit ballot</button>
    </form>
  </section>
  <div id="readOnly" class="msg" hidden></div>

  <section id="standings">
    <h2>Standings</h2>
    <div class="board" id="board"><div class="msg">Loading scores…</div></div>
    <div class="voters" id="voters"></div>
  </section>
</div>

<script>
const CHILIS=[
  {id:"erin",name:"Erin",kind:"Vegetarian",veg:true},
  {id:"ali",name:"Ali",kind:"Beef",veg:false},
  {id:"dana",name:"Dana",kind:"Chicken",veg:false},
  {id:"andy",name:"Andy",kind:"Vegetarian",veg:true},
];
const $=s=>document.querySelector(s);
const scores={}; let ballots=[]; let pending=null; let busy=false;

function renderEntries(){
  $("#entries").innerHTML="";
  CHILIS.forEach(c=>{
    const d=document.createElement("div"); d.className="entry";
    d.innerHTML=`<div class="entry-head"><span class="name"></span><span class="tag ${c.veg?"veg":"meat"}"></span></div>
      <div class="scale" role="group" aria-label="Score for ${c.name}"></div>
      <div class="ends"><span>1 · skip it</span><span>10 · seconds, please</span></div>`;
    d.querySelector(".name").textContent=c.name+"’s chili";
    d.querySelector(".tag").textContent=c.kind;
    const sc=d.querySelector(".scale");
    for(let n=1;n<=10;n++){
      const b=document.createElement("button"); b.type="button"; b.id=`s-${c.id}-${n}`;
      b.textContent=n; b.setAttribute("aria-pressed",scores[c.id]===n);
      b.onclick=()=>{scores[c.id]=n; sc.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",+x.textContent===n)); validate();};
      sc.appendChild(b);
    }
    $("#entries").appendChild(d);
  });
}
const cleanInit=()=>$("#initials").value.toUpperCase().replace(/[^A-Z]/g,"");
function validate(){ $("#submit").disabled=busy || cleanInit().length<2 || !CHILIS.every(c=>scores[c.id]); }
$("#initials").addEventListener("input",e=>{e.target.value=cleanInit(); hideMsg(); validate();});
function showMsg(t){const m=$("#formMsg"); m.textContent=t; m.hidden=false;}
function hideMsg(){$("#formMsg").hidden=true; $("#confirmRow").hidden=true; $("#submit").hidden=false;}

async function save(init,replace){
  busy=true; validate();
  try{
    const r=await fetch("/api/ballots",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({initials:init,scores,replace})});
    const j=await r.json().catch(()=>({}));
    if(r.status===409){
      pending=init; showMsg(`${init} already voted. Replace that ballot with this one?`);
      $("#confirmRow").hidden=false; $("#submit").hidden=true;
    }else if(!r.ok){ showMsg(j.error||"That ballot didn’t save. Submit again."); }
    else{
      CHILIS.forEach(c=>delete scores[c.id]); $("#initials").value=""; renderEntries();
      showMsg(`Thanks, ${init}. Your ballot is in.`); load();
      $("#standings").scrollIntoView({behavior:"smooth"});
    }
  }catch(err){ showMsg("No connection. Check your signal and submit again."); }
  busy=false; validate();
}
$("#ballot").addEventListener("submit",e=>{e.preventDefault(); save(cleanInit(),false);});
$("#cancelOverwrite").onclick=()=>{hideMsg(); pending=null;};
$("#confirmOverwrite").onclick=()=>{hideMsg(); save(pending,true); pending=null;};

function renderBoard(){
  const n=ballots.length;
  if(!n){$("#board").innerHTML='<div class="msg">No ballots yet. The first judge’s scores will show up here.</div>'; $("#voters").textContent=""; return;}
  const rows=CHILIS.map(c=>{const t=ballots.reduce((s,b)=>s+(+b[c.id]||0),0); return {...c,total:t,avg:t/n};})
    .sort((a,b)=>b.avg-a.avg);
  $("#board").innerHTML="";
  rows.forEach((r,i)=>{
    const tie=i>0&&r.avg===rows[i-1].avg;
    const el=document.createElement("div"); el.className="rank"+(i===0?" lead":"");
    el.innerHTML=`<span class="pos"></span><div><div class="name"></div><span class="tag ${r.veg?"veg":"meat"}"></span><div class="bar"><i style="width:${r.avg*10}%"></i></div></div>
      <div class="score"><b></b><small></small></div>`;
    el.querySelector(".pos").textContent=tie?"=":i+1;
    el.querySelector(".name").textContent=r.name;
    el.querySelector(".tag").textContent=r.kind;
    el.querySelector(".score b").textContent=r.avg.toFixed(1);
    el.querySelector(".score small").textContent=`${r.total} pts`;
    $("#board").appendChild(el);
  });
  const v=$("#voters"); v.textContent=`${n} ballot${n===1?"":"s"}: `;
  ballots.slice().sort((a,b)=>a.at-b.at).forEach(b=>{const s=document.createElement("span"); s.textContent=b.initials; v.appendChild(s);});
}
async function load(){
  try{ const r=await fetch("/api/ballots",{cache:"no-store"}); const j=await r.json(); ballots=j.ballots||[]; renderBoard(); }
  catch{ if(!ballots.length) $("#board").innerHTML='<div class="msg">Couldn’t load scores. Pull to refresh.</div>'; }
}
renderEntries(); validate(); load(); setInterval(load,5000);
</script>
</body></html>
